{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="x-ua-compatible" content="ie=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
   <meta name="description" content="{% block meta_description %}{{ site_settings.site_name }} — {{ site_settings.tagline }}{% endblock %}">
   <title>{% block title %}{{ site_settings.site_name }}{% endblock %}</title>

   <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">

   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Rethink+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

   <!-- TransHub CSS -->
   <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
   <link rel="stylesheet" href="{% static 'css/fancybox.css' %}">
   <link rel="stylesheet" href="{% static 'css/swiper-bundle.min.css' %}">
   <link rel="stylesheet" href="{% static 'css/all.min.css' %}">
   <link rel="stylesheet" href="{% static 'css/jarallax.min.css' %}">
   <link rel="stylesheet" href="{% static 'css/nice-select.css' %}">
   <link rel="stylesheet" href="{% static 'css/jquery.datepicker.css' %}">
   <link rel="stylesheet" href="{% static 'css/jquery.timepicker.min.css' %}">
   <link rel="stylesheet" href="{% static 'css/style.css' %}">
   <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
   <link rel="stylesheet" href="{% static 'css/site-custom.css' %}">

   {% block extra_css %}{% endblock %}
</head>
<body>

   {% include "partials/header.html" %}

   {% include "partials/messages.html" %}

   {% block content %}{% endblock %}

   {% include "partials/footer.html" %}

   <script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
   <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
   <script src="{% static 'js/jarallax.min.js' %}"></script>
   <script src="{% static 'js/purecounter.js' %}"></script>
   <script src="{% static 'js/jquery.nice-select.min.js' %}"></script>
   <script src="{% static 'js/isotope.pkgd.min.js' %}"></script>
   <script src="{% static 'js/swiper-bundle.min.js' %}"></script>
   <script src="{% static 'js/jquery.marquee.min.js' %}"></script>
   <script src="{% static 'js/fancybox.umd.js' %}"></script>
   <script src="{% static 'js/gsap.min.js' %}"></script>
   <script src="{% static 'js/ScrollTrigger.min.js' %}"></script>
   <script src="{% static 'js/SplitText.js' %}"></script>
   <script src="{% static 'js/lenis.min.js' %}"></script>
   <script src="{% static 'js/bootstrap-datepicker.js' %}"></script>
   <script src="{% static 'js/jquery.timepicker.min.js' %}"></script>
   <script src="{% static 'js/form.js' %}"></script>
   <script src="{% static 'js/custom.js' %}"></script>

   {% block extra_js %}{% endblock %}
</body>
</html>
